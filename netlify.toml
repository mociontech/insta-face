# Next.js: la salida de la app es .next (la gestiona el plugin de Netlify). Se fija aquí para que mande sobre
# cualquier "Publish directory" que el sitio tenga puesto en la interfaz (p. ej. "dist", que es de las apps Vite).
[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
