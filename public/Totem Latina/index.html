  <style>
    /* Ensure text is left-aligned inside items */
    .item .title {
      text-align: left;
    }

    /* Animated gradient border without rotating/tilting the button */
    :root {
      --ringA: #8b5cf6;
      /* violet */
      --ringB: #ec4899;
      /* pink */
      --ringC: #d946ef;
      /* fuchsia */
    }

    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes spinAngle {
      to {
        --angle: 360deg;
      }
    }

    .btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      font-weight: 800;
      font-size: .96rem;
      color: #fff;
      border: 1.5px solid transparent;
      border-radius: 8px;
      /* === MODIFICADO (Redondez reducida 60%) === */
      background:
        linear-gradient(#0f1325, #0f1325) padding-box,
        conic-gradient(from var(--angle), var(--ringA), var(--ringB), var(--ringC), var(--ringA)) border-box;
      animation: spinAngle 2.5s linear infinite;
      /* regular speed */
      transition: transform .18s ease, box-shadow .28s ease;
    }

    .btn:hover {
      transform: translateY(-4px);
      box-shadow:
        0 12px 32px rgba(0, 0, 0, .60),
        0 0 28px rgba(139, 92, 246, .35),
        0 0 36px rgba(236, 72, 153, .27);
    }
  </style>

  <div aria-hidden="true" aria-modal="true" class="modal hidden" id="videoModal" role="dialog">
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-content" role="document">
      <button class="modal-close" data-close="true" aria-label="Cerrar">&times;</button>
      <video controls="" id="modalVideo" playsinline="" preload="metadata"></video>
      <img id="modalImage" alt="Sección Interactiva"
        style="display: none; border-radius: 12px; object-fit: contain; max-height: 92vh; max-width: 92vw; vertical-align: middle;" />
    </div>

  <style>
    .hidden {
      display: none
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
    }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(6px);
    }

    .modal-content {
      position: relative;
      z-index: 1;
      /* width:min(960px, 92vw); */
      /* Comentado */
      max-height: 86vh;
      background: #000;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
      overflow: hidden;
    }

    .modal-close {
      position: absolute;
      top: 8px;
      right: 10px;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: none;
      background: rgba(255, 255, 255, .08);
      color: #fff;
      font-size: 22px;
      line-height: 36px;
      cursor: pointer;
      z-index: 10;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, .15);
    }

    #modalVideo {
      display: block;
      width: 100%;
      height: auto;
      max-height: 86vh;
      outline: none;
    }

    /* Optional: prevent page from scrolling when modal open */
    body.modal-open {
      overflow: hidden;
    }
  </style>

  <script>
    (function () {
      const modal = document.getElementById('videoModal');
      const videoEl = document.getElementById('modalVideo');
      const imageEl = document.getElementById('modalImage');
      const videoButtons = Array.from(document.querySelectorAll('.item .btn'));
      const goButton = document.querySelector('.icon-go-btn');
      const closeEls = Array.from(document.querySelectorAll('[data-close="true"]'));

      function openVideoModal(src) {
        if (!src) return;

        imageEl.style.display = 'none';
        videoEl.style.display = 'block';

        videoEl.src = src;
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('modal-open');

        const tryPlay = () => {
          const p = videoEl.play();
          if (p && p.catch) { p.catch(() => { }); }
        };
        videoEl.addEventListener('loadeddata', tryPlay, { once: true });
        videoEl.load();
      }

      function closeModal() {
        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();
        videoEl.style.display = 'none';

        imageEl.removeAttribute('src');
        imageEl.style.display = 'none';

        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('modal-open');
      }

      // Event listeners para botones de video
      videoButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const videoSrc = btn.getAttribute('data-video');
          if (videoSrc) {
            openVideoModal(videoSrc);
          }
        });
      });

      // Event listener para el botón de navegación a /camera
      if (goButton) {
        goButton.addEventListener('click', (e) => {
          e.preventDefault();
          window.location.href = '/interactive';
        });
      }

      closeEls.forEach(el => el.addEventListener('click', closeModal));

      modal.addEventListener('click', (e) => {
        if (e.target && e.target.getAttribute('data-close') === 'true') {
          closeModal();
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
      });

      videoEl.addEventListener('ended', closeModal);
    })();
  </script>
  <style>
    /* Never show modal on initial load */
    .modal.hidden {
      display: none !important;
    }

    /* Only size the video when modal is visible */
    .modal:not(.hidden) #modalVideo {
      height: 92vh;
      width: auto;
      max-width: 92vw;
      object-fit: contain;
      background: #000;
    }

    /* When hidden, make sure video doesn't impose any layout */
    .modal.hidden #modalVideo {
      height: auto;
      width: auto;
      max-width: 100%;
      background: transparent;
    }
  </style>
  <script>
    (function () {
      const modal = document.getElementById('videoModal');
      const videoEl = document.getElementById('modalVideo');
      if (modal && videoEl) {
        // enforce hidden state on first paint
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
        try {
          videoEl.pause();
        } catch (e) { }
        videoEl.removeAttribute('src');
        videoEl.load();
      }
    })();
  </script>
  <style>

  </style>
  <style>
    /* === MODIFICADO (Cambiado de 'flex' a 'inline-block' y quitado width: auto) === */
    /* Center the portrait video regardless of viewport width */
    .modal-content {
      display: inline-block !important;
      /* Era 'flex' */
      position: relative !important;
      /* Aseguramos que sea el ancla */
      /* width:auto !important; */
      /* Comentado para que inline-block defina el ancho */
      height: auto !important;
      max-width: 92vw !important;
      max-height: 92vh !important;
      background: transparent !important;
      box-shadow: none !important;
      vertical-align: middle;
      /* Ayuda al centrado en el grid */
    }

    /* === CORRECCIÓN FINAL (Quitado el !important de display:block) === */
    #modalVideo {
      display: block;
      /* Era display:block !important; */
      margin: 0 auto !important;
      height: 92vh !important;
      width: auto !important;
      max-width: 92vw !important;
      object-fit: contain !important;
      border-radius: 12px !important;
      background: #000 !important;
    }

    @media (max-height:700px) {
      #modalVideo {
        height: 86vh !important;
      }
    }
  </style>

  <style>
    .fs-btn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      width: 10px;
      /* 50% más pequeño */
      height: 10px;
      /* 50% más pequeño */
      border-radius: 50%;
      background: #090814;
      border: 1px solid #161621;
      cursor: pointer;
      z-index: 10000;
      overflow: hidden;
      transition: opacity .2s ease, box-shadow .3s ease;
      opacity: 0.25;
      /* 50% más transparente */
    }

    .fs-btn:hover {
      opacity: 0.5;
      box-shadow: 0 0 6px #161621;
      /* brillo sutil */
    }

    .fs-btn::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: rgba(22, 22, 33, 0.6);
      transform: scale(0);
      opacity: 0;
      transition: transform 0.5s ease, opacity 0.8s ease;
    }

    .fs-btn:active::after {
      transform: scale(2.5);
      opacity: 1;
      transition: transform 0.5s ease, opacity 0.8s ease;
    }
  </style>
  <style>
    .fs-btn {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      width: 35px;
      /* tamaño actualizado */
      height: 35px;
      border-radius: 50%;
      background: #090814;
      border: 1px solid #161621;
      cursor: pointer;
      z-index: 10000;
      overflow: hidden;
      transition: opacity .2s ease, box-shadow .3s ease;
      opacity: 0.75;
      /* más visible */
    }

    .fs-btn:hover {
      opacity: 1;
      box-shadow: 0 0 6px #161621;
      /* brillo sutil */
    }

    .fs-btn::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: rgba(22, 22, 33, 0.6);
      transform: scale(0);
      opacity: 0;
      transition: transform 0.5s ease, opacity 0.8s ease;

    .fs-btn:active::after {

  </style>
  <script>
    (function () {
      const btn = document.getElementById('fsBtn');
      if (!btn) return;

      btn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          const el = document.documentElement;
          const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen || el.mozRequestFullScreen;
          if (req) req.call(el);
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen || document.mozCancelFullScreen;
          if (exit) exit.call(document);
        }
      });
    })();
  </script>
  <script>
    (function () {
      const modal = document.getElementById('videoModal');
      const videoEl = document.getElementById('modalVideo');
      let startX = 0, startY = 0, endX = 0, endY = 0;

      modal.addEventListener('touchstart', (e) => {
        if (!modal.classList.contains('hidden')) {
          const touch = e.touches[0];
          startX = touch.clientX;
          startY = touch.clientY;
        }
      }, { passive: true });

      modal.addEventListener('touchend', (e) => {
        if (!modal.classList.contains('hidden')) {
          const touch = e.changedTouches[0];
          endX = touch.clientX;
          endY = touch.clientY;
          const diffX = Math.abs(endX - startX);
          const diffY = Math.abs(endY - startY);
          if (diffX > 50 || diffY > 50) {
            // Cerrar modal si hubo swipe en cualquier dirección
            videoEl.pause();
            videoEl.removeAttribute('src');
            videoEl.load();
            modal.classList.add('hidden');
            modal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('modal-open');
          }
        }
      }, { passive: true });
    })();
  </script>
